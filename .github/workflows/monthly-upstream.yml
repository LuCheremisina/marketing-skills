name: Monthly upstream review
on:
  schedule:
    # 00:00 Asia/Novosibirsk falls at 17:00 UTC on the previous month's final day.
    # Check every possible final day; the script handles February and leap years.
    - cron: '0 17 28-31 * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: monthly-upstream-review
  cancel-in-progress: false
jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - name: Check upstream versions and prepare reviewed candidates
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = schedule ]; then
            python scripts/monitor_upstream.py --scheduled
          else
            python scripts/monitor_upstream.py
          fi
      - run: python scripts/validate.py
      - run: python scripts/audit_public.py
      # Results are logged in full; candidate changes stay in this ephemeral runner.
      # The local monthly task reruns the review and prepares PRs with the existing gh login.
