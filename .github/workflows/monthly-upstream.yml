name: Monthly upstream review
on:
  schedule:
    # 00:00 Asia/Novosibirsk falls at 17:00 UTC on the previous month's final day.
    # Check every possible final day; the script handles February and leap years.
    - cron: '0 17 28-31 * *'
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: monthly-upstream-review
  cancel-in-progress: false
jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - name: Check upstream versions and prepare reviewed candidates
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = schedule ]; then
            python scripts/monitor_upstream.py --scheduled
          else
            python scripts/monitor_upstream.py
          fi
      - run: python scripts/validate.py
      - run: python scripts/audit_public.py
      - uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7
        with:
          branch: codex/monthly-upstream
          delete-branch: true
          commit-message: 'chore: prepare reviewed upstream skill updates'
          title: 'Review upstream versions, license changes and adapted skill updates'
          body: |
            Automated public-source review. Licensed packages are updated only after unchanged-license verification, baseline checks, three-way adaptation merge and validation. Conflicts remain explicit in catalog/upstream-observations.json.

            No installation, release or merge is performed. Runtime compatibility must be accepted again for changed packages.
          add-paths: |
            catalog/vendor-sources.json
            catalog/upstream-observations.json
            catalog/skills.json
            vendor/skills
