# Пример вводных — локальный сервисный бизнес (стоматология), Вариант Б без
# полей сверки. Показывает intake без e-commerce терминологии и без
# готовности владельца обсуждать позиционирование/УТП.
# Компания вымышленная.

company_name: "Стоматология Белый Мост"
website: "https://belyymost.example"

offer: "Стоматологические услуги: лечение, протезирование, имплантация"
customer: "Жители района в радиусе 15-20 минут от клиники, в основном семьи с детьми и взрослые 30-55 лет"
channel: ["сайт", "Яндекс.Карты и 2ГИС", "рекомендации текущих пациентов", "реклама в Яндекс.Директе"]
competitor_hypotheses: ["другие стоматологии в радиусе 20 минут", "сетевые стоматологии в городе"]
research_goal: "Понять, почему новые пациенты чаще приходят на разовые приёмы, но не остаются на постоянное обслуживание"

business_stage: "mature"
sales_model: "one_time"
strategic_context:
  years_on_market: "9"
  team_size: "12 человек, включая 5 врачей"
  regions: "один город, один филиал"
  approx_revenue: "unknown"
  main_goal: "увеличить долю пациентов, которые возвращаются на повторные приёмы"
